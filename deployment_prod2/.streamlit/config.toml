[theme]
base = "light"
primaryColor         = "#2563eb"
backgroundColor      = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor            = "#0f172a"
font                 = "sans serif"

[server]
port                 = 8501
headless             = false
runOnSave            = false
